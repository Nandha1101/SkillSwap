version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: skillswap_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: skillswap_db
      POSTGRES_USER: skillswap_user
      POSTGRES_PASSWORD: skillswap_secure_password_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillswap_user -d skillswap_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: skillswap_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: skillswap_web
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 skillswap.asgi:application"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - DJANGO_DEBUG=0
      - DJANGO_SECRET_KEY=production-secret-change-me-in-production
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,web
      - DB_ENGINE=postgresql
      - DB_NAME=skillswap_db
      - DB_USER=skillswap_user
      - DB_PASSWORD=skillswap_secure_password_2026
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"

  nginx:
    image: nginx:alpine
    container_name: skillswap_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume:

