{% extends "marketplace/base.html" %}
{% block title %}Password updated · SkillSwap{% endblock %}
{% block content %}
<main class="auth-page">
  <header class="auth-topbar">
    <a class="landing-brand" href="{% url 'landing' %}" aria-label="SkillSwap home">
      <span class="brand-mark" aria-hidden="true">s</span>
      <span>skillswap<span class="brand-period">.</span></span>
    </a>
  </header>

  <div class="auth-layout" style="max-width: 520px; margin: 3rem auto;">
    <div class="auth-card" style="padding: 2.5rem; background: #fffdfa; border: 1px solid #efe4da; border-radius: 16px; text-align: center;">
      <span style="font-size: 2.5rem; color: #50d5ad;" aria-hidden="true">✓</span>
      <h1 style="font-family: 'Instrument Serif', Georgia, serif; font-size: 2.8rem; margin: 0.8rem 0 0.5rem;">Password <em>changed.</em></h1>
      <p style="color: #766a62; font-size: 0.88rem; line-height: 1.6; margin-bottom: 2rem;">Your password has been set. You may go ahead and log in now with your new password.</p>
      <a href="{% url 'login' %}" class="button-mint" style="display: inline-block;">Log in to SkillSwap <span>↗</span></a>
    </div>
  </div>
</main>
{% endblock %}
